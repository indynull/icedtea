[workspace]
members = [".", "icedtea-gallery"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Ali-Akber Saifee <ali@indydevs.org>"]
repository = "https://github.com/indynull/icedtea"
homepage = "https://github.com/indynull/icedtea"

[package]
name = "icedtea"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native desktop widgets and chrome for iced"
readme = "README.md"
documentation = "https://docs.rs/icedtea"
keywords = ["gui", "iced", "desktop", "widgets", "theme"]
categories = ["gui"]
include = [
    "src/**",
    "assets/**",
    "book/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "icedtea"
path = "src/lib.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "markdown", "highlighter", "canvas", "image", "svg", "advanced"] }
iced_selection = { version = "0.5", features = ["markdown"] }
mundy = { version = "0.2", default-features = false, features = ["accent-color", "color-scheme", "async-io"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace"] }
objc2-foundation = { version = "0.3", default-features = false }

[dev-dependencies]
iced_tiny_skia = "0.14"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
