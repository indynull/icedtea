[workspace]
members = [".", "icedtea-gallery"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Ali-Akber Saifee <ali@indydevs.org>"]
repository = "https://github.com/indynull/icedtea"
homepage = "https://github.com/indynull/icedtea"

[package]
name = "icedtea"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native desktop widgets and chrome for iced"
readme = "README.md"
documentation = "https://docs.rs/icedtea"
keywords = ["gui", "iced", "desktop", "widgets", "theme"]
categories = ["gui"]
include = [
    "src/**",
    "assets/**",
    "book/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "icedtea"
path = "src/lib.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "markdown", "highlighter", "canvas", "image", "svg", "advanced"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
iced_tiny_skia = "0.14"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
