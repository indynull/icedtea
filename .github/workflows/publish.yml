name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Tag after master is green. Publishes crates.io and a GitHub release.
# Does not re-run the check.
jobs:
  crates-io:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish
      - name: Linux graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev lld
      - name: Faster linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$tag"
          test "$tag" = "$ver"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p icedtea --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$tag"
          test "$tag" = "$ver"
      - name: Changelog notes
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "icedtea ${ver}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
