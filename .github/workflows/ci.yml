name: check

on:
  push:
    branches: [master]
    tags-ignore: ["v*"]
    paths-ignore:
      - "book/**"
      - "assets/**"
      - ".grok/**"
      - "TODO.md"
      - "CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "book/**"
      - "assets/**"
      - ".grok/**"
      - "TODO.md"
      - "CHANGELOG.md"

permissions:
  contents: read

# One in-flight check per branch / pull request; a new push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          cache-on-failure: true
      - name: Linux graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev lld
      - name: Faster linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ runner.os }}
          cache-on-failure: true
      - name: Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev lld
      - name: Faster linker
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace --all-features

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
          cache-on-failure: true
      - name: Linux graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev lld
      - name: Faster linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - run: cargo doc --locked --package icedtea --no-deps --document-private-items

  cov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: cov
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Linux graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev lld
      - name: Faster linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      # Leave target/llvm-cov-target so rust-cache can reuse it. Local
      # `just cov` still deletes the tree after a passing report.
      - name: Line coverage
        run: cargo llvm-cov --locked --package icedtea --all-features --ignore-filename-regex 'src[/\\]host' --lcov --output-path lcov.info
      - name: HTML report
        if: always()
        run: cargo llvm-cov report --ignore-filename-regex 'src[/\\]host' --html --output-dir coverage-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          if-no-files-found: error
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
      - name: Fail under 99
        run: cargo llvm-cov report --ignore-filename-regex 'src[/\\]host' --fail-under-lines 99

  # Upcoming compilers. Tests only; rustfmt/clippy stay on the 1.89 pin.
  rustc:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    env:
      RUSTFLAGS: --deny warnings
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: rustc-${{ matrix.rust }}
          cache-on-failure: true
      - name: Linux graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev lld
      - name: Faster linker
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace --all-features
