<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Five pieces of an icedtea window</title>
  <desc id="desc">Boot starts the window. Tokens color it. One Action feeds every chrome row. Constructors are the controls. Patterns put those controls in a layout. The application owns state and receives messages.</desc>
  <defs>
    <filter id="lift" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a0c10" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="18" fill="#14181C"/>

  <g filter="url(#lift)">
    <rect x="40" y="28" width="720" height="464" rx="14" fill="#1E1E1E" stroke="#33424E"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- Boot -->
    <rect x="40" y="28" width="720" height="72" rx="14" fill="#242F38"/>
    <rect x="40" y="72" width="720" height="28" fill="#242F38"/>
    <text x="64" y="58" fill="#0178D4" font-size="11" font-weight="700" letter-spacing="0.14em">BOOT</text>
    <text x="64" y="82" fill="#E0E0E0" font-size="15">Starts the iced window.</text>
    <text x="736" y="70" text-anchor="end" fill="#8A93A0" font-size="13">run! · daemon!</text>

    <!-- Tokens -->
    <line x1="40" y1="100" x2="760" y2="100" stroke="#33424E"/>
    <text x="64" y="128" fill="#0178D4" font-size="11" font-weight="700" letter-spacing="0.14em">TOKENS</text>
    <text x="64" y="150" fill="#E0E0E0" font-size="15">Color every face. Every widget takes these.</text>
    <circle cx="592" cy="136" r="8" fill="#1E1E1E" stroke="#4A5A68"/>
    <circle cx="616" cy="136" r="8" fill="#242F38" stroke="#4A5A68"/>
    <circle cx="640" cy="136" r="8" fill="#0178D4"/>
    <circle cx="664" cy="136" r="8" fill="#FEA62B"/>
    <circle cx="688" cy="136" r="8" fill="#E0E0E0"/>
    <text x="736" y="141" text-anchor="end" fill="#8A93A0" font-size="12">mix</text>

    <!-- Action -->
    <line x1="40" y1="168" x2="760" y2="168" stroke="#33424E"/>
    <text x="64" y="196" fill="#0178D4" font-size="11" font-weight="700" letter-spacing="0.14em">ACTION</text>
    <text x="64" y="218" fill="#E0E0E0" font-size="15">Write Save once. It is the menu, the toolbar, and ctrl+s.</text>
    <rect x="580" y="190" width="52" height="22" rx="5" fill="#0178D4"/>
    <text x="606" y="205" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Save</text>
    <text x="736" y="205" text-anchor="end" fill="#8A93A0" font-size="12">ctrl+s</text>

    <!-- Constructors + Patterns -->
    <line x1="40" y1="236" x2="760" y2="236" stroke="#33424E"/>
    <rect x="40" y="236" width="360" height="168" fill="#1A232B"/>
    <rect x="398" y="248" width="2" height="144" rx="1" fill="#4A5A68"/>

    <text x="64" y="268" fill="#0178D4" font-size="11" font-weight="700" letter-spacing="0.14em">PATTERNS</text>
    <text x="64" y="296" fill="#E0E0E0" font-size="15">Layout recipes.</text>
    <text x="64" y="318" fill="#B6B6B6" font-size="13">list/detail, dock, main window</text>
    <rect x="64" y="336" width="88" height="48" rx="6" fill="#242F38" stroke="#33424E"/>
    <rect x="160" y="336" width="200" height="48" rx="6" fill="#242F38" stroke="#33424E"/>
    <text x="108" y="365" text-anchor="middle" fill="#8A93A0" font-size="11">list</text>
    <text x="260" y="365" text-anchor="middle" fill="#8A93A0" font-size="11">detail</text>

    <text x="428" y="268" fill="#0178D4" font-size="11" font-weight="700" letter-spacing="0.14em">CONSTRUCTORS</text>
    <text x="428" y="296" fill="#E0E0E0" font-size="15">The controls you call.</text>
    <text x="428" y="318" fill="#B6B6B6" font-size="13">Each returns an Element and a message.</text>
    <text x="428" y="352" fill="#8A93A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">toolbar · list_view · textarea</text>

    <!-- App -->
    <rect x="40" y="404" width="720" height="88" rx="14" fill="#242F38"/>
    <rect x="40" y="404" width="720" height="20" fill="#242F38"/>
    <text x="64" y="436" fill="#0178D4" font-size="11" font-weight="700" letter-spacing="0.14em">YOUR APPLICATION</text>
    <text x="64" y="462" fill="#E0E0E0" font-size="15">You own the notes, the selection, and the files.</text>
  </g>
</svg>
