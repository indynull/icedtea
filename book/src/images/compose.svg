<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">How a window is composed</title>
  <desc id="desc">Boot starts the window. Tokens color it. An ActionTable of many Actions feeds the toolbar and shortcuts. A list/detail pattern lays out the list_view and textarea constructors.</desc>

  <rect width="800" height="500" rx="18" fill="#14181C"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="28" fill="#6B9EFF" font-size="13" font-weight="600">Boot</text>
    <text x="80" y="28" fill="#A3A3A3" font-size="13">run!(Boot::new(…))</text>
    <text x="400" y="28" fill="#6B9EFF" font-size="13" font-weight="600">Tokens</text>
    <text x="456" y="28" fill="#A3A3A3" font-size="13">color every constructor</text>

    <rect x="40" y="48" width="420" height="420" rx="8" fill="#202020" stroke="#3A3A3A"/>

    <!-- toolbar: several actions -->
    <rect x="40" y="48" width="420" height="44" rx="8" fill="#2B2B2B"/>
    <rect x="40" y="76" width="420" height="16" fill="#2B2B2B"/>
    <rect x="56" y="60" width="72" height="22" rx="5" fill="#6B9EFF"/>
    <text x="92" y="76" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">file.save</text>
    <rect x="136" y="60" width="76" height="22" rx="5" fill="#2B2B2B" stroke="#3A3A3A"/>
    <text x="174" y="76" text-anchor="middle" fill="#F2F2F2" font-size="11">file.open</text>
    <rect x="220" y="60" width="76" height="22" rx="5" fill="#2B2B2B" stroke="#3A3A3A"/>
    <text x="258" y="76" text-anchor="middle" fill="#F2F2F2" font-size="11">edit.undo</text>

    <!-- list / detail -->
    <rect x="48" y="104" width="120" height="316" rx="6" fill="#252525" stroke="#3A3A3A"/>
    <text x="108" y="260" text-anchor="middle" fill="#A3A3A3" font-size="12">list_view</text>
    <rect x="176" y="104" width="272" height="316" rx="6" fill="#252525" stroke="#3A3A3A"/>
    <rect x="188" y="120" width="2" height="14" fill="#F2F2F2"/>
    <text x="312" y="260" text-anchor="middle" fill="#A3A3A3" font-size="12">textarea</text>

    <!-- status: shortcut from the table, no status string -->
    <rect x="40" y="432" width="420" height="36" rx="8" fill="#2B2B2B"/>
    <rect x="40" y="432" width="420" height="12" fill="#2B2B2B"/>
    <text x="440" y="456" text-anchor="end" fill="#A3A3A3" font-size="12">ctrl+s</text>

    <!-- callouts -->
    <line x1="460" y1="70" x2="500" y2="70" stroke="#6B9EFF"/>
    <text x="512" y="60" fill="#6B9EFF" font-size="13" font-weight="600">ActionTable</text>
    <text x="512" y="78" fill="#F2F2F2" font-size="13">many Action rows</text>
    <text x="512" y="96" fill="#A3A3A3" font-size="12">Pattern · toolbar</text>

    <line x1="460" y1="262" x2="500" y2="262" stroke="#6B9EFF"/>
    <text x="512" y="252" fill="#6B9EFF" font-size="13" font-weight="600">Pattern</text>
    <text x="512" y="270" fill="#F2F2F2" font-size="13">list_detail</text>
    <text x="512" y="288" fill="#A3A3A3" font-size="12">Constructors · list_view, textarea</text>

    <line x1="460" y1="450" x2="500" y2="450" stroke="#6B9EFF"/>
    <text x="512" y="440" fill="#6B9EFF" font-size="13" font-weight="600">Action</text>
    <text x="512" y="458" fill="#F2F2F2" font-size="13">file.save · ctrl+s</text>
    <text x="512" y="476" fill="#A3A3A3" font-size="12">Pattern · status_bar</text>
  </g>
</svg>
