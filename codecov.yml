codecov:
  notify:
    after_n_builds: 3
coverage:
  precision: 2
  round: down
  range: 100..100
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        after_n_builds: 3
    patch:
      default:
        target: 100%
        threshold: 0%
        after_n_builds: 3
ignore:
  - "src/host*"
  - "icedtea-gallery"
  - "examples"
  - "book"
